# Server & App
server.port=${SERVER_PORT:8080}
spring.application.name=edge-gateway
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
spring.main.web-application-type=reactive


  

# Eureka Configuration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=edge-gateway:${server.port}
spring.main.web-application-type=reactive

 eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.registry-fetch-interval-seconds=30


eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30




# ===============================
# SECURITY
# ===============================
jwt.secret=${JWT_SECRET}

# CORS (comma-separated origin patterns; override per environment via CORS_ALLOWED_ORIGIN_PATTERNS)
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,https://qrcodetableordering.com,https://*.qrcodetableordering.com}
cors.allow-credentials=false
cors.max-age=3600
# WebSocket failed-auth rate limiter (protects gateway from reconnect storms with expired JWTs)
security.ws-auth-failure-rate-limit.enabled=${SECURITY_WS_AUTH_FAILURE_RATE_LIMIT_ENABLED:true}
security.ws-auth-failure-rate-limit.max-attempts=${SECURITY_WS_AUTH_FAILURE_MAX_ATTEMPTS:1}
security.ws-auth-failure-rate-limit.window-seconds=${SECURITY_WS_AUTH_FAILURE_WINDOW_SECONDS:1}
security.ws-auth-failure-rate-limit.cooldown-seconds=${SECURITY_WS_AUTH_FAILURE_COOLDOWN_SECONDS:10}

# user-management microservice
spring.cloud.gateway.server.webflux.routes[0].id=user-management
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-management
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
# restaurant-management microservice
spring.cloud.gateway.server.webflux.routes[1].id=restaurant-management
spring.cloud.gateway.server.webflux.routes[1].uri=lb://restaurant-management
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/restaurant/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
# integration-management microservice
spring.cloud.gateway.server.webflux.routes[2].id=integration-management
spring.cloud.gateway.server.webflux.routes[2].uri=lb://integration-management
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/integration/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Actuator Configuration
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}

logging.api.slow.warn-threshold-ms=100
logging.api.slow.error-threshold-ms=3000

# Gateway HTTP client safeguards: fail fast and avoid unbounded held connections.
spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=5s
spring.cloud.gateway.httpclient.pool.type=fixed
spring.cloud.gateway.httpclient.pool.max-connections=500
spring.cloud.gateway.httpclient.pool.acquire-timeout=3000
spring.cloud.gateway.httpclient.pool.max-idle-time=20s
spring.cloud.gateway.httpclient.pool.max-life-time=120s
spring.cloud.gateway.httpclient.pool.eviction-interval=30s


springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=User Management
springdoc.swagger-ui.urls[0].url=/user/v3/api-docs

springdoc.swagger-ui.urls[1].name=Restaurant Management
springdoc.swagger-ui.urls[1].url=/restaurant/v3/api-docs

springdoc.swagger-ui.urls[2].name=Integration Management
springdoc.swagger-ui.urls[2].url=/integration/v3/api-docs