# Server
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# App identity
spring.application.name=integration-management

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Eureka Discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# DB Config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.auto-commit=false

# AWS S3 Configuration
aws.upload.api=${AWS_UPLOAD_API}
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}



# file storage base directory
file.storage.base-directory=${FILE_STORAGE_BASE_DIRECTORY}
file.upload.maxSize=5000000
file.upload.extensions=png,jpeg,jpg,csv,xlsx,xls,pdf,mp3,mp4
data.image.baseurl=3
data.on.premises=false

# Attachment upload configuration
attachment.photos.upload.maxsize=5000000
attachment.photos.upload.extensions=png,jpeg,jpg,gif
attachment.audios.upload.maxsize=10000000
attachment.audios.upload.extensions=mp3,wav,aac
attachment.videos.upload.maxsize=50000000
attachment.videos.upload.extensions=mp4,avi,mov
attachment.docs.upload.maxsize=10000000
attachment.docs.upload.extensions=pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv

# Custom logging configuration
custom.logging.enabled=true
logging.api.slow.warn-threshold-ms=100
logging.api.slow.error-threshold-ms=3000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.liquibase.enabled=false

# Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}

# RabbitMQ Configuration

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=/

app.firebase-configuration-file=${FIREBASE_CONFIGURATION_FILE}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Actuator Configuration
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.health.rabbitmq.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=false

