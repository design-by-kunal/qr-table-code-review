server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
spring.application.name=user-management


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.auto-commit=false

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

localization.languages=en,ja,th

# Message Source Configuration
spring.messages.basename=messages
spring.messages.encoding=UTF-8
springdoc.packages-to-scan=com.gulfnet.usermanagement,com.gulfnet.shared_library.dto


eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# Disable Liquibase
spring.liquibase.enabled=false
# AWS S3 Configuration

aws.upload.api=${AWS_UPLOAD_API}
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}


# Bulk upload configuration
bulk.upload.max-file-size=10485760
bulk.upload.max-record-count=1000
bulk.upload.allowed-extensions=csv

# App configuration
app.bulk-upload-path=/tmp/bulk-uploads
app.app-on-premises=false

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true


# Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}

app.default.registration.email=${APP_DEFAULT_REGISTRATION_EMAIL}


# Frontend URLs by Role (Manager and HQ Admin only)
app.frontend.url.manager=${APP_FRONTEND_URL_MANAGER}
app.frontend.url.hq-admin=${APP_FRONTEND_URL_HQ_ADMIN}
app.frontend.url.default=${APP_FRONTEND_URL_DEFAULT}


# Restaurant Management Service Configuration
app.restaurant-management.base-url=${APP_RESTAURANT_MANAGEMENT_BASE_URL:http://localhost:8083}


# Redis Cache Configuration

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE}

spring.data.redis.timeout=2000ms
spring.cache.redis.time-to-live=3600
spring.cache.type=redis

# RabbitMQ Configuration

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=/

jwt.secret=${JWT_SECRET}
jwt.expiry-hours=24


# App identity
spring.profiles.active=default
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Encryption Configuration
# RSA Public Key (PEM format or Base64)
app.encryption.rsa-public-key=${APP_ENCRYPTION_RSA_PUBLIC_KEY:}
# RSA Private Key (PEM format or Base64)
app.encryption.rsa-private-key=${APP_ENCRYPTION_RSA_PRIVATE_KEY:}

# Disable Liquibase
spring.liquibase.enabled=false

# Actuator Configuration
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.health.rabbitmq.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.api.slow.warn-threshold-ms=100
logging.api.slow.error-threshold-ms=3000
