# Omise Payment Gateway Configuration
# These values should be set in your .env.local file (or environment variables)
# Example in .env.local:
# OMISE_PAYPAY_SECRET_KEY=skey_test_xxxxx
# OMISE_PAYPAY_PUBLIC_KEY=pkey_test_xxxxx
# OMISE_PAYPAY_WEBHOOK_SECRET=webhook_secret_xxxxx
# OMISE_PROMPTPAY_SECRET_KEY=skey_test_xxxxx
# OMISE_PROMPTPAY_PUBLIC_KEY=pkey_test_xxxxx
# OMISE_PROMPTPAY_WEBHOOK_SECRET=webhook_secret_xxxxx
# OMISE_PAYNOW_SECRET_KEY=skey_test_xxxxx
# OMISE_PAYNOW_PUBLIC_KEY=pkey_test_xxxxx
# OMISE_PAYNOW_WEBHOOK_SECRET=webhook_secret_xxxxx
#
# Where to find Omise keys:
# 1. Secret Key & Public Key: Dashboard > Settings > Keys (per Omise account)
# 2. Webhook Secret: Dashboard > Settings > Webhooks (one secret per Omise account)
#    - PayPay, PromptPay, and PayNow use separate Omise accounts; configure each webhook secret
#    - OMISE_WEBHOOK_SECRET is deprecated; falls back to PayPay only if OMISE_PAYPAY_WEBHOOK_SECRET is unset
omise.paypay.secret-key=${OMISE_PAYPAY_SECRET_KEY:}
omise.paypay.public-key=${OMISE_PAYPAY_PUBLIC_KEY:}
omise.paypay.webhook-secret=${OMISE_PAYPAY_WEBHOOK_SECRET:${OMISE_WEBHOOK_SECRET:}}
omise.promptpay.secret-key=${OMISE_PROMPTPAY_SECRET_KEY:}
omise.promptpay.public-key=${OMISE_PROMPTPAY_PUBLIC_KEY:}
omise.promptpay.webhook-secret=${OMISE_PROMPTPAY_WEBHOOK_SECRET:}
omise.paynow.secret-key=${OMISE_PAYNOW_SECRET_KEY:}
omise.paynow.public-key=${OMISE_PAYNOW_PUBLIC_KEY:}
omise.paynow.webhook-secret=${OMISE_PAYNOW_WEBHOOK_SECRET:}
omise.webhook.verify-signature=${OMISE_WEBHOOK_VERIFY_SIGNATURE:true}

# PayNow / PromptPay: local folder for Omise QR images until payment completes (deleted on webhook success)
payment.paynow.qr.storage-dir=${PAYNOW_QR_STORAGE_DIR:./data/paynow-qr}
# Full prefix for PromptPay short qrCode URL (e.g. http://localhost:8080/restaurant)
payment.omise.qr.api-base-url=${OMISE_QR_API_BASE_URL:}
