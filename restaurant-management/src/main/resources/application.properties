# GMO Shop Admin → Payment result notification URL (HTTPS). Path on this service: POST /api/v1/gmo/link-plus/notify
# Local: https://<ngrok-subdomain>.ngrok-free.app/api/v1/gmo/link-plus/notify  (ngrok forwards to server.port, e.g. 8082)
# Prod:  https://<your-host>/api/v1/gmo/link-plus/notify  (prepend /restaurant or other gateway prefix if applicable)
